[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-song-generator-studio"
version = "0.6.2"
description = "AI full-song generator with vocals and lyrics — desktop studio for prompt-to-song rendering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-song-generator-studio contributors" }]
keywords = ["ai", "music", "song-generator", "vocals", "lyrics", "tts", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]

dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "soundfile>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
    "torchaudio>=2.4",
]
onnx = [
    "onnxruntime-gpu>=1.18; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
songgen = "songgen.bootstrap:main"

[project.urls]
Homepage = "https://github.com/yourname/ai-song-generator-studio"
Issues = "https://github.com/yourname/ai-song-generator-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["songgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["songgen/core", "songgen/services", "songgen/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and model weights on disk",
    "gpu: requires CUDA-capable device",
]